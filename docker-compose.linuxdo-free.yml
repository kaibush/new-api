name: new-api-linuxdo-free

services:
  new-api-linuxdo-free:
    image: "${NEW_API_IMAGE:?Set the linuxdo-free image digest or tag}"
    container_name: new-api-linuxdo-free
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${NEW_API_PORT:-3001}:3000"
    environment:
      SQL_DSN: "newapi_linuxdo_free:${MYSQL_PASSWORD:?Set a dedicated database password}@tcp(new-api-mysql:3306)/new_api_linuxdo_free?charset=utf8mb4&parseTime=True&loc=Local"
      SESSION_SECRET: "${SESSION_SECRET:?Set an independent session secret}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?Set an independent crypto secret}"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: "https://igrok.lvyrix.com"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:?Set the Docker network gateway IP}"
      TZ: Asia/Shanghai
      NODE_NAME: new-api-linuxdo-free
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    networks:
      - mysql
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3000/api/status | grep -q ''"success":true''']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  mysql:
    external: true
    name: "${MYSQL_NETWORK:-new-api_default}"
